name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]

permissions:
  packages: write
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./MCP.Extensions

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore ../mcp.extensions.sln

    - name: Run tests
      run: dotnet test ../MCP.Extensions.Tests/MCP.Extensions.Tests.csproj --configuration Release --no-restore --verbosity normal --logger trx --results-directory TestResults

    - name: Publish test results
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: .NET Tests
        path: ./MCP.Extensions/TestResults/*.trx
        reporter: dotnet-trx

    - name: Determine Package Version
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "release" ]]; then
          # For releases, use the tag name, stripping any 'v' prefix
          raw_version="${{ github.ref_name }}"
          final_version="${raw_version#v}"
        else
          # For non-release builds (e.g., push to main)
          git fetch --tags --force
          git fetch --prune --unshallow || true
          # Updated pattern to find tags with or without 'v' prefix
          latest_tag=$(git describe --tags --abbrev=0 --match "v[0-9]*.[0-9]*.[0-9]*" --match "[0-9]*.[0-9]*.[0-9]*" 2>/dev/null || echo "v0.0.0")

          # Strip 'v' prefix for version calculation
          base_version="${latest_tag#v}"

          # Increment patch version
          IFS='.' read -r major minor patch <<< "$base_version"
          patch=$((patch + 1))
          next_version="$major.$minor.$patch"

          # Append pre-release suffix
          final_version="$next_version-preview.${{ github.run_id }}"
        fi

        echo "PACKAGE_VERSION=$final_version" >> $GITHUB_ENV
        echo "Using version: $final_version"
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Pack
      run: dotnet pack MCP.Extensions.csproj --configuration Release -p:PackageVersion=${{ env.PACKAGE_VERSION }} --no-restore --output ./nupkg

    - name: Publish to GitHub Packages
      run: |
        dotnet nuget add source --username echapmanFromBunnings --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text --name github "https://nuget.pkg.github.com/echapmanFromBunnings/index.json"
        dotnet nuget push ./nupkg/*.nupkg --source "github" --api-key ${{ secrets.GITHUB_TOKEN }}
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
    - name: Publish to NuGet.org
      run: dotnet nuget push ./nupkg/*.nupkg --source "https://api.nuget.org/v3/index.json" --api-key ${{ secrets.NUGET_API_KEY }}
      continue-on-error: true
    - name: Clean up
      run: rm -r ./nupkg
